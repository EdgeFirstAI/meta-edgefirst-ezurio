BBPATH .= ":${LAYERDIR}"

BBFILES += "\
    ${LAYERDIR}/recipes-*/*/*.bb \
    ${LAYERDIR}/recipes-*/*/*.bbappend \
"

BBFILES_DYNAMIC += "\
    fsl-bsp-release:${LAYERDIR}/dynamic-layers/imx-bsp/recipes-*/*/*.bbappend \
    imx-machine-learning:${LAYERDIR}/dynamic-layers/imx-ml/recipes-*/*/*.bbappend \
"

BBFILE_COLLECTIONS += "edgefirst-ezurio"
BBFILE_PATTERN_edgefirst-ezurio = "^${LAYERDIR}/"
BBFILE_PRIORITY_edgefirst-ezurio = "11"

LAYERDEPENDS_edgefirst-ezurio = "summit-som meta-edgefirst"
LAYERSERIES_COMPAT_edgefirst-ezurio = "walnascar"

# Three layers provide kernel-module-imx-gpu-viv. Pin the meta-imx-bsp version
# so the image build resolves the same recipe the module is built from.
PREFERRED_VERSION_kernel-module-imx-gpu-viv:mx8mp-nxp-bsp = "6.4.11.p4.2"

# The Neutron DT overlay is superseded by the node changes in the kernel patch.
KERNEL_DEVICETREE:remove:imx95-nitrogen-smarc = "freescale/nitrogen-imx95-smarc-nutron.dtbo"

# The deployed bootloader may not have been built with ZSTD support, so store
# the kernel uncompressed in the FIT.
FIT_KERNEL_COMP_ALG:imx8mp-nitrogen-smarc-4g = "none"
